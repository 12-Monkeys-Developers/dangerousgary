  - _id: EDrxwaqLnf5XCESY
    name: Combat et macros
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>Le suivi de combat</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/dangerousgary/assets/guide/combat.webp" alt="Suivi de combat" /></div>
            <div>
              <p>
                Dangerous Gary n'utilise pas de jet d'initiative : les donjexeurs agissent avant les Monstres. Le suivi de combat du système applique cette règle tout seul.
              </p>
              <ul>
                <li>
                  Les boutons de jet d'initiative et la valeur d'initiative ne sont pas affichés. Quand un combattant est ajouté au combat (un MJ doit être connecté), sa place
                  est calculée : les <strong>Personnages</strong> d'abord, du plus <strong>dextre</strong> au moins dextre, puis les <strong>Rencontres</strong>, dans un ordre
                  aléatoire.
                </li>
                <li>
                  Le poing <i class="fas fa-fist-raised"></i> marque un combattant comme <strong>ayant joué</strong> : il descend en bas de la liste et s'estompe. Un joueur
                  peut marquer ses personnages, sans pouvoir revenir en arrière. Le MJ peut cliquer sur tous les poings, et un second clic de sa part annule la marque.
                </li>
                <li>Le MJ peut <strong>faire glisser</strong> un combattant sur un autre pour changer l'ordre du round en cours.</li>
                <li>
                  Il n'y a pas de boutons de tour précédent ou suivant. Un <strong>clic</strong> sur un combattant sélectionne son token et centre la vue sur lui ; pour le
                  MJ, il devient aussi le combattant actif du suivi.
                </li>
                <li>
                  Le bouton <strong>Round suivant</strong> <i class="fa-solid fa-forward-step"></i> reste grisé tant que tous les combattants (hors vaincus) n'ont pas
                  joué. Si le MJ annule la marque d'un combattant, il se grise de nouveau.
                </li>
                <li>
                  Au <strong>round suivant</strong>, toutes les marques « a joué » sont effacées et l'ordre est recalculé : les Personnages selon leur Dextérité actuelle, les
                  Rencontres de nouveau au hasard.
                </li>
              </ul>
            </div>
          </div>

          <h2>Les effets continus</h2>
          <p>
            Certains effets durent : une mâchoire verrouillée qui inflige des dégâts à chaque round, un drain de Force ou d'expérience, des flammes. Ils sont posés sur le
            token par un effet spécial d'attaque dont la case <strong>chaque round</strong> est cochée (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.01Y5Jr6ZBUXkRBYz]{La Rencontre}). Une icône les signale sur le token, et la
            fiche du Personnage ou de la Rencontre les liste sous son en-tête.
          </p>
          <p>
            À chaque <strong>Round suivant</strong>, le système publie une carte « Round N : effets continus » qui liste, pour chaque combattant non vaincu, ses effets
            continus et la <strong>régénération</strong> des Rencontres blessées. Le MJ y dispose de deux boutons par ligne :
          </p>
          <ul>
            <li><strong>Appliquer</strong> : lance la formule et applique le résultat (dégâts avec armure déduite, perte de caractéristique ou d'XP, PV regagnés) ;</li>
            <li>
              <strong>Mettre fin à l'effet</strong> : retire l'effet continu de l'acteur, qui ne sera plus proposé. Le MJ peut aussi y mettre fin à tout moment depuis la
              fiche, avec l'icône <i class="fas fa-ban"></i>.
            </li>
          </ul>
          <p class="guide-astuce">
            Les joueurs voient sur la carte les lignes de leurs personnages, pas celles des Rencontres. Rien n'est appliqué sans le clic du MJ : un personnage libéré entre
            deux rounds n'encaisse pas de dégâts par erreur.
          </p>

          <h2>La barre de macros</h2>
          <div class="guide-image"><img src="systems/dangerousgary/assets/guide/barre-macros.webp" alt="Macros créées par glisser-déposer" /></div>
          <p>Faites glisser un élément d'une fiche dans la barre de macros pour créer un raccourci :</p>
          <table class="guide-table">
            <tr>
              <th>Élément glissé</th>
              <th>Clic</th>
              <th><kbd>Maj</kbd>+clic</th>
            </tr>
            <tr>
              <td>Nom d'une caractéristique (FOR, DEX, VOL)</td>
              <td>Sauvegarde</td>
              <td>Sauvegarde de classe</td>
            </tr>
            <tr>
              <td>Arme (ligne de l'équipement avec des dégâts)</td>
              <td>Jet de dégâts</td>
              <td>Options de dégâts (contrainte, exaltée)</td>
            </tr>
            <tr>
              <td>Attaque d'une Rencontre (ligne avec des dégâts)</td>
              <td>Jet de dégâts</td>
              <td>Options de dégâts (contrainte, exaltée)</td>
            </tr>
            <tr>
              <td>Icône de repos (en-tête de la fiche)</td>
              <td colspan="2">Applique ce repos (Pause, Repos, Repos sécurisé ou médicalisé)</td>
            </tr>
            <tr>
              <td>Talent (onglet Classe et talents)</td>
              <td colspan="2">Sauvegarde de classe du talent, avec perte de points de vie en cas d'échec</td>
            </tr>
          </table>
          <p>
            La macro porte le nom de l'élément suivi de celui du personnage, par exemple « Pistolet (Brenda) ». Si une macro de ce nom existe déjà, elle est réutilisée au lieu
            d'être dupliquée.
          </p>
          <p>
            La macro d'une attaque de Rencontre sert à tous les tokens de ce Monstre : elle lance les dégâts pour le token <strong>sélectionné</strong> de cette Rencontre,
            et à défaut pour la Rencontre d'où elle a été glissée. Comme tout jet de dégâts, elle les applique aux tokens ciblés.
          </p>
        </div>
