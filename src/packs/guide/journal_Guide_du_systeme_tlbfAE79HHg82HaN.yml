  - _id: EDrxwaqLnf5XCESY
    name: Combat et macros
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>Le suivi de combat</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/dangerousgary/assets/guide/combat.webp" alt="Suivi de combat" /></div>
            <div>
              <p>
                Dangerous Gary n'utilise pas de jet d'initiative : les donjexeurs agissent avant les Monstres. Le suivi de combat du système applique cette règle tout seul.
              </p>
              <ul>
                <li>
                  Les boutons de jet d'initiative et la valeur d'initiative ne sont pas affichés. Quand un combattant est ajouté au combat (un MJ doit être connecté), sa place
                  est calculée : les <strong>Personnages</strong> d'abord, du plus <strong>dextre</strong> au moins dextre, puis les <strong>Rencontres</strong>, dans un ordre
                  aléatoire.
                </li>
                <li>
                  Le poing <i class="fas fa-fist-raised"></i> marque un combattant comme <strong>ayant joué</strong> : il descend en bas de la liste et s'estompe. Le MJ peut
                  cliquer sur tous les poings, un joueur seulement sur ceux de ses personnages. Un second clic annule.
                </li>
                <li>Le MJ peut <strong>faire glisser</strong> un combattant sur un autre pour changer l'ordre du round en cours.</li>
                <li>
                  Au <strong>round suivant</strong>, toutes les marques « a joué » sont effacées et l'ordre est recalculé : les Personnages selon leur Dextérité actuelle, les
                  Rencontres de nouveau au hasard.
                </li>
              </ul>
            </div>
          </div>

          <h2>La barre de macros</h2>
          <div class="guide-image"><img src="systems/dangerousgary/assets/guide/barre-macros.webp" alt="Macros créées par glisser-déposer" /></div>
          <p>Faites glisser un élément de la fiche de Personnage dans la barre de macros pour créer un raccourci :</p>
          <table class="guide-table">
            <tr>
              <th>Élément glissé</th>
              <th>Clic</th>
              <th><kbd>Maj</kbd>+clic</th>
            </tr>
            <tr>
              <td>Nom d'une caractéristique (FOR, DEX, VOL)</td>
              <td>Sauvegarde</td>
              <td>Sauvegarde de classe</td>
            </tr>
            <tr>
              <td>Arme (ligne de l'équipement avec des dégâts)</td>
              <td>Jet de dégâts</td>
              <td>Options de dégâts (contrainte, exaltée)</td>
            </tr>
            <tr>
              <td>Talent (onglet Classe et talents)</td>
              <td colspan="2">Sauvegarde de classe du talent, avec perte de points de vie en cas d'échec</td>
            </tr>
          </table>
          <p>
            La macro porte le nom de l'élément suivi de celui du personnage, par exemple « Pistolet (Brenda) ». Si une macro de ce nom existe déjà, elle est réutilisée au lieu
            d'être dupliquée. Les jets d'une Rencontre se lancent depuis sa fiche : elle ne crée pas de macro.
          </p>
        </div>
