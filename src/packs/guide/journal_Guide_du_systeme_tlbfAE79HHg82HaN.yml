  - _id: 01Y5Jr6ZBUXkRBYz
    name: La Rencontre
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>La Rencontre</h2>
          <div class="guide-image"><img src="systems/dangerousgary/assets/guide/fiche-rencontre.webp" alt="Fiche de rencontre" /></div>
          <p>
            La fiche de <strong>Rencontre</strong> décrit un Monstre ou un PNJ sur une seule page. Comme pour le Personnage, elle s'ouvre en mode <strong>Lecture</strong> ;
            l'interrupteur de la barre de titre passe en mode <strong>Écriture</strong> pour modifier les maximums et gérer les attaques.
          </p>

          <h3>L'en-tête</h3>
          <ul>
            <li>Le portrait (un clic ouvre le sélecteur d'image) et le nom.</li>
            <li>
              <strong>FOR</strong>, <strong>DEX</strong> et <strong>VOL</strong>, avec leur valeur actuelle et leur maximum : cliquez sur l'abréviation pour faire une
              sauvegarde. Une Rencontre n'a pas de sauvegarde de classe.
            </li>
            <li>Les <strong>PV</strong> et l'<strong>Armure</strong>. Comme pour les donjexeurs, l'armure n'est pas déduite automatiquement des dégâts.</li>
          </ul>

          <h3>Les défenses</h3>
          <p>Le cadre <strong>Défenses</strong> règle ce que la Rencontre impose à ceux qui l'attaquent. Il agit quand son token est <strong>ciblé</strong> au moment du jet de dégâts.</p>
          <table class="guide-table">
            <tr>
              <th>Réglage</th>
              <th>Effet</th>
            </tr>
            <tr>
              <td><strong>Attaques contre elle</strong></td>
              <td>
                <strong>Contraintes</strong> ou <strong>Exaltées</strong> : les jets de dégâts qui la ciblent prennent ce type. Ce réglage reste modifiable en mode Lecture,
                car il dépend de la situation (en vol, dans le noir, immobilisée…).
              </td>
            </tr>
            <tr>
              <td><strong>Dégâts reçus</strong></td>
              <td>
                <strong>Divisés par deux</strong> (arrondi à l'inférieur, avant l'armure), ou <strong>Deux dés, le plus bas</strong> : l'attaquant lance deux dés de dégâts
                et garde le plus faible.
              </td>
            </tr>
            <tr>
              <td><strong>Aura de terreur</strong></td>
              <td>
                Les attaques des donjexeurs de ce niveau ou moins sont contraintes (0 : pas d'aura). Le niveau d'un donjexeur est son niveau le plus élevé parmi ses classes.
              </td>
            </tr>
            <tr>
              <td><strong>Régénération</strong></td>
              <td>Les PV regagnés à chaque changement de round : un nombre ou un dé (<code>3</code>, <code>1d6</code>). Vide : pas de régénération.</td>
            </tr>
          </table>
          <p class="guide-astuce">
            Le type imposé par la cible se combine avec les états de l'attaquant : une contrainte et une exaltation se compensent. <kbd>Maj</kbd>+clic sur le dé de dégâts
            permet toujours de choisir un autre type. Si plusieurs cibles n'ont pas les mêmes défenses, un avertissement s'affiche et elles ne sont pas appliquées :
            ciblez-les séparément.
          </p>

          <h3>Les attaques</h3>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/fiche-attaque.webp" alt="Fiche d'une attaque" /></div>
            <div>
              <p>
                Chaque attaque est un objet de type <strong>Attaque</strong> : un nom, une formule de <strong>dégâts</strong> et une description. En mode Écriture, le
                <strong>+</strong> du cadre <strong>Attaques</strong> en crée une ; on peut aussi en déposer une venue de la barre latérale ou d'un compendium.
              </p>
              <p>
                Sur la fiche, la ligne d'une attaque affiche ses dégâts ; un clic la déplie pour lire sa description. Le dé <i class="fas fa-dice-d20"></i> lance les dégâts,
                <kbd>Maj</kbd>+clic propose une attaque contrainte ou exaltée (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.H6d2D2QVYtF1Kwbx]{Jets et messages}).
              </p>
            </div>
          </div>
          <h3>Les options et effets spéciaux d'une attaque</h3>
          <p>La fiche d'une attaque propose, en mode Écriture :</p>
          <ul>
            <li>
              <strong>Dommages critiques</strong> : sur le résultat maximal, le dé de dégâts est relancé une fois et ajouté (« sur un 8, +1D8 ») ;
            </li>
            <li><strong>Ignore l'armure</strong> : l'armure de la cible n'est pas déduite ;</li>
            <li>
              des <strong>effets spéciaux</strong>, ajoutés avec <strong>Ajouter un effet spécial</strong>. Chacun a un nom et quatre réglages :
            </li>
          </ul>
          <table class="guide-table">
            <tr>
              <th>Réglage</th>
              <th>Rôle</th>
            </tr>
            <tr>
              <td><strong>Dé</strong></td>
              <td>
                Les résultats naturels du dé de dégâts qui déclenchent l'effet, par exemple 5 à 6 (une seule case remplie = ce résultat précis). Laissez les deux cases vides
                pour un effet <strong>à chaque coup</strong>. Une attaque exaltée compte comme le résultat maximal.
              </td>
            </tr>
            <tr>
              <td><strong>Sauvegarde</strong></td>
              <td>La sauvegarde (FOR, DEX, VOL) qui permet à la cible d'éviter l'effet. Sans sauvegarde, l'effet est subi aussitôt.</td>
            </tr>
            <tr>
              <td><strong>Effet</strong> et formule</td>
              <td>
                <strong>Dégâts</strong> supplémentaires (armure déduite), <strong>perte</strong> de points de FOR, de DEX ou de VOL, ou <strong>Aucun</strong> pour un simple
                rappel. La formule accepte un dé (<code>1d4</code>) ou un nombre. S'y ajoute la <strong>perte d'XP</strong>.
              </td>
            </tr>
            <tr>
              <td><strong>chaque round</strong></td>
              <td>
                Case à cocher : l'effet devient <strong>continu</strong>. Il n'est pas subi tout de suite mais posé sur la cible, puis proposé à chaque changement de round
                (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.EDrxwaqLnf5XCESY]{Combat et macros}).
              </td>
            </tr>
            <tr>
              <td><strong>Précision</strong></td>
              <td>Un texte libre affiché sur la carte : un état, une durée, une consigne (« paralysé pour la scène », « 1D8 dégâts au début de chaque round »).</td>
            </tr>
          </table>
          <p>
            Quand un effet se déclenche sur une cible, la carte de dégâts l'indique sous son nom. Sans sauvegarde, la perte est appliquée avec les dégâts. Avec une
            sauvegarde, la carte propose le bouton <strong>Sauvegarde de …</strong> au joueur de la cible (ou au MJ) : réussie, l'effet est évité ; ratée, il est appliqué.
            Sans token ciblé, la carte rappelle seulement les effets déclenchés.
          </p>
          <p>Sur la fiche de la Rencontre, le survol du nom d'une attaque affiche sa description, puis ses options et un résumé de chaque effet spécial.</p>
          <p class="guide-astuce">
            Exemples : Ghast, <em>Venin paralysant</em> — dé 4, effet Perte de DEX <code>1d4</code>. Voisin, <em>Déchirure dimensionnelle</em> — dé 6, sauvegarde DEX, effet
            Dégâts <code>1d10</code>. Chien-hyène, <em>Mâchoire verrouillée</em> — dé 6, effet Dégâts <code>1d8</code>, case « chaque round » cochée.
          </p>

          <h3>Description et pouvoirs</h3>
          <p>
            Sous les attaques, deux zones de texte riche : les <strong>Pouvoirs</strong> et la <strong>Description</strong>. Un jet écrit sous la forme
            <code>[[/r 1d4]]</code> devient un lien cliquable, pratique pour un pouvoir qui fait perdre des points de caractéristique.
          </p>
        </div>
