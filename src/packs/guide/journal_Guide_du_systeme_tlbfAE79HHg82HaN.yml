  - _id: B5mvayI7qCFZcDBz
    name: Réglages
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>Le réglage du système</h2>
          <div class="guide-image"><img src="systems/dangerousgary/assets/guide/reglages.webp" alt="Réglages du système" /></div>
          <p>
            Le système n'a qu'un réglage, dans la fenêtre <strong>Paramètres de la partie</strong> (onglet <strong>Paramètres</strong> de la barre latérale), catégorie
            <strong>Dangerous Gary</strong> :
          </p>
          <table class="guide-table">
            <tr>
              <th>Réglage</th>
              <th>Effet</th>
            </tr>
            <tr>
              <td><strong>Classe et talents</strong></td>
              <td>
                Désactivé par défaut. Une fois activé, les joueurs voient l'onglet <strong>Classe et talents</strong> de leur fiche, ainsi que les <strong>artefacts</strong> dans
                l'onglet Équipement. Le MJ voit toujours cet onglet et ces artefacts, que le réglage soit actif ou non : il peut préparer les classes avant de les révéler.
                Changer ce réglage recharge le monde.
              </td>
            </tr>
          </table>
          <p class="guide-astuce">
            Les classes et les talents arrivent en cours de campagne. Laissez le réglage désactivé au début et activez-le quand les donjexeurs découvrent leur premier talent.
          </p>

          <h2>Scènes et tokens</h2>
          <ul>
            <li>La grille des nouvelles scènes est réglée sur <strong>1,5 m</strong> par case.</li>
            <li>
              Un nouveau <strong>Personnage</strong> reçoit un token <strong>lié</strong> à sa fiche, de disposition <strong>amicale</strong> et doté de la
              <strong>vision</strong>. Les Rencontres gardent les réglages par défaut de Foundry.
            </li>
            <li>
              Les barres des tokens affichent par défaut les <strong>points de vie</strong> (barre principale) et la <strong>Force</strong> (barre secondaire), les deux
              compteurs qui mènent au choc et à la mort.
            </li>
          </ul>
        </div>
