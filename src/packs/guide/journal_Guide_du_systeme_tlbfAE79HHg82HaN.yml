_id: tlbfAE79HHg82HaN
name: Guide du système
pages:
  - _id: nU5S7qoXnx7VCATH
    name: Introduction
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>Bienvenue</h2>
          <p>
            Ce guide présente ce que le système <strong>Dangerous Gary</strong> pour Foundry VTT met à votre disposition : les fiches des donjexeurs et des rencontres, les jets
            de sauvegarde et de dégâts, les classes et leurs talents, les artefacts, le combat et les macros. Il ne remplace pas le livre de règles : il explique comment
            Foundry vous aide à les appliquer.
          </p>

          <h3>Sommaire</h3>
          <ul>
            <li>@UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.B5mvayI7qCFZcDBz]{Réglages} : le réglage du monde et la configuration des scènes et des tokens.</li>
            <li>@UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.AjSC5t5kjsmsNFZq]{Le Personnage} : la fiche des donjexeurs, l'équipement et les repos.</li>
            <li>@UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.mdWehQH6tzWz2xyA]{Classes, talents et artefacts} : l'onglet Classe et talents, l'Osmose et les artefacts.</li>
            <li>@UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.01Y5Jr6ZBUXkRBYz]{La Rencontre} : la fiche des Monstres et des PNJ, et leurs attaques.</li>
            <li>@UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.H6d2D2QVYtF1Kwbx]{Jets et messages} : les sauvegardes, les dégâts et les cartes du tchat.</li>
            <li>@UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.EDrxwaqLnf5XCESY]{Combat et macros} : le suivi de combat et la barre de macros.</li>
          </ul>

          <h3>Version</h3>
          <p>Ce guide décrit la version <strong>1.3.7</strong> du système, qui nécessite <strong>Foundry VTT V14</strong>.</p>

          <h2>Les types de documents</h2>
          <p>Le système définit deux types d'acteurs :</p>
          <ul>
            <li><strong>Personnage</strong> : un donjexeur, joué par un joueur ou par le MJ ;</li>
            <li><strong>Rencontre</strong> : un Monstre ou un PNJ, avec ses attaques et ses pouvoirs.</li>
          </ul>
          <p>Et quatre types d'objets :</p>
          <ul>
            <li><strong>Équipement</strong> : un objet, une armure ou une arme, à déposer sur un Personnage ;</li>
            <li><strong>Attaque</strong> : une attaque de Rencontre, avec sa formule de dégâts ;</li>
            <li><strong>Talent</strong> : un talent de classe, à déposer sur un Personnage ;</li>
            <li><strong>Artefact</strong> : un objet doté de capacités liées aux classes, à déposer sur un Personnage.</li>
          </ul>
          <p>
            Chaque fiche n'accepte que les objets qui la concernent : une fiche de Personnage refuse les attaques, une fiche de Rencontre n'accepte que les attaques.
          </p>

          <h2>Les compendiums</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/dangerousgary/assets/guide/compendiums.webp" alt="Compendiums du système" /></div>
            <div>
              <p>Le système fournit deux compendiums :</p>
              <ul>
                <li>
                  <strong>Guide du système</strong> : ce guide. Par défaut, seul le MJ (et les assistants) y a accès ; pour l'ouvrir aux joueurs, faites un clic
                  droit sur le compendium, choisissez <strong>Configurer les droits</strong> et donnez-leur le niveau Observateur.
                </li>
                <li>
                  <strong>Talents</strong> : les talents des neuf classes, du niveau 1 au niveau 9, rangés dans un dossier par classe. Par défaut, seuls le MJ, les joueurs de
                  confiance (en lecture) et les assistants (en écriture) y ont accès.
                </li>
              </ul>
              <p>Faites glisser un talent du compendium sur une fiche de Personnage pour l'ajouter (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.mdWehQH6tzWz2xyA]{Classes, talents et artefacts}).</p>
            </div>
          </div>
        </div>
