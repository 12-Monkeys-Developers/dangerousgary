  - _id: AjSC5t5kjsmsNFZq
    name: Le Personnage
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>Le Personnage</h2>
          <div class="guide-image"><img src="systems/dangerousgary/assets/guide/fiche-personnage.webp" alt="Fiche de personnage en mode Lecture" /></div>

          <h3>Mode Lecture et mode Écriture</h3>
          <p>
            Toutes les fiches s'ouvrent en mode <strong>Lecture</strong> : on joue (jets, équipement, repos) sans risquer de modifier une valeur de référence par erreur.
            L'interrupteur en haut à gauche de la barre de titre passe la fiche en mode <strong>Écriture</strong>.
          </p>
          <div class="guide-image"><img src="systems/dangerousgary/assets/guide/fiche-personnage-edition.webp" alt="Fiche de personnage en mode Écriture" /></div>
          <p>En mode Lecture, restent modifiables :</p>
          <ul>
            <li>le nom, la description courte sous le nom et le portrait (un clic sur le portrait ouvre le sélecteur d'image) ;</li>
            <li>les valeurs <strong>actuelles</strong> des caractéristiques et des points de vie, qui bougent sans cesse en jeu ;</li>
            <li>les points d'équipement et l'état équipé des objets.</li>
          </ul>
          <p>Le mode Écriture débloque en plus :</p>
          <ul>
            <li>les <strong>maximums</strong> des caractéristiques et des points de vie, les points d'expérience ;</li>
            <li>les trois <strong>spécialités</strong> et l'<strong>atout</strong> (nom et description) ;</li>
            <li>les boutons pour modifier ou supprimer un objet, et la zone <strong>Divers</strong> de l'équipement.</li>
          </ul>
          <p>
            On peut déposer des objets sur la fiche dans les deux modes. Sur les fiches d'objets, le nom n'est modifiable qu'en mode Écriture.
          </p>

          <h3>Caractéristiques, points de vie et expérience</h3>
          <ul>
            <li>
              <strong>Force</strong>, <strong>Dextérité</strong> et <strong>Volonté</strong> ont une valeur actuelle et un maximum. Cliquez sur le nom d'une caractéristique pour
              faire une sauvegarde, <kbd>Maj</kbd>+clic pour une sauvegarde de classe (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.H6d2D2QVYtF1Kwbx]{Jets et messages}).
            </li>
            <li>Les <strong>points de vie</strong> ont eux aussi une valeur actuelle et un maximum.</li>
            <li>Les <strong>points d'expérience</strong> se modifient en mode Écriture.</li>
          </ul>
          <p>Faites glisser le nom d'une caractéristique dans la barre de macros pour créer un raccourci de sauvegarde (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.EDrxwaqLnf5XCESY]{Combat et macros}).</p>

          <h3>Spécialités et atout</h3>
          <p>
            La colonne de gauche contient trois emplacements de <strong>spécialité</strong>. À droite, l'<strong>atout</strong> a un nom et une description en texte riche.
          </p>

          <h3>Les onglets</h3>
          <ul>
            <li><strong>Biographie</strong> : un texte libre.</li>
            <li><strong>Équipement</strong> (ouvert par défaut) : les objets, les armures, les armes et, si les classes sont actives, les artefacts.</li>
            <li><strong>Classe et talents</strong> : les classes, les talents et l'Osmose (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.mdWehQH6tzWz2xyA]{Classes, talents et artefacts}). Visible des joueurs seulement si le réglage est actif.</li>
          </ul>

          <h2>Les repos</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/menu-repos.webp" alt="Menu de la barre de titre avec les repos" /></div>
            <div>
              <p>Les repos se trouvent dans le menu de la barre de titre de la fiche (bouton <strong>⋮</strong>) :</p>
              <table class="guide-table">
                <tr>
                  <th>Repos</th>
                  <th>Effet</th>
                </tr>
                <tr>
                  <td><strong>Pause</strong></td>
                  <td>Points de vie au maximum.</td>
                </tr>
                <tr>
                  <td><strong>Repos</strong></td>
                  <td>Points de vie au maximum, +1 en Force, Dextérité et Volonté.</td>
                </tr>
                <tr>
                  <td><strong>Repos sécurisé</strong></td>
                  <td>Points de vie au maximum, +2 dans chaque caractéristique.</td>
                </tr>
                <tr>
                  <td><strong>Repos médicalisé</strong></td>
                  <td>Points de vie au maximum, +3 dans chaque caractéristique.</td>
                </tr>
              </table>
              <p>Une caractéristique ne dépasse jamais son maximum. Le repos s'applique immédiatement, sans message dans le tchat.</p>
            </div>
          </div>

          <h2>L'équipement</h2>
          <p>
            En haut de l'onglet, le compteur de <strong>points d'équipement</strong> se modifie librement. En dessous, la liste des objets : un clic sur une ligne déplie sa
            description, qui apparaît aussi en infobulle au survol du nom. Chaque ligne indique :
          </p>
          <ul>
            <li><strong>Encombrant</strong> pour un objet encombrant ;</li>
            <li>la <strong>protection</strong> d'une armure ;</li>
            <li>la formule de <strong>dégâts</strong> d'une arme, suivie de l'icône <i class="fas fa-burst"></i> si l'arme inflige des dommages critiques.</li>
          </ul>
          <p>
            Le bouclier <i class="fa-regular fa-shield"></i> <strong>équipe</strong> ou déséquipe l'objet. Une arme n'affiche son dé <i class="fas fa-dice-d20"></i> de dégâts
            que lorsqu'elle est équipée. Une arme peut aussi être glissée dans la barre de macros (voir @UUID[Compendium.dangerousgary.guide.JournalEntry.tlbfAE79HHg82HaN.JournalEntryPage.EDrxwaqLnf5XCESY]{Combat et macros}).
          </p>
          <p>Sous la liste, la zone <strong>Divers</strong> accueille en texte libre le petit matériel qui ne mérite pas un objet.</p>

          <h3>La fiche d'équipement</h3>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/fiche-arme.webp" alt="Fiche d'une arme" /></div>
            <div>
              <p>
                Un équipement est un objet, une <strong>armure</strong> ou une <strong>arme</strong>. On peut le marquer comme <strong>encombrant</strong> ou
                <strong>équipé</strong>. Une armure a une valeur de <strong>protection</strong>. Une arme a une <strong>catégorie</strong>, une formule de
                <strong>dégâts</strong> et une case <strong>Dommages critiques</strong>.
              </p>
              <p>Choisir une catégorie remplit les dégâts et les dommages critiques avec les valeurs du livre, modifiables ensuite :</p>
              <table class="guide-table">
                <tr>
                  <th>Catégorie</th>
                  <th>Dégâts</th>
                  <th>Critiques</th>
                </tr>
                <tr>
                  <td>Corps à corps</td>
                  <td>1d4</td>
                  <td>non</td>
                </tr>
                <tr>
                  <td>Armes de mêlée</td>
                  <td>1d6</td>
                  <td>non</td>
                </tr>
                <tr>
                  <td>Armes à distance</td>
                  <td>1d8</td>
                  <td>non</td>
                </tr>
                <tr>
                  <td>Grandes armes de mêlée</td>
                  <td>1d8</td>
                  <td>non</td>
                </tr>
                <tr>
                  <td>Armes de poing</td>
                  <td>1d8</td>
                  <td>oui</td>
                </tr>
                <tr>
                  <td>Fusils</td>
                  <td>1d10</td>
                  <td>oui</td>
                </tr>
                <tr>
                  <td>Armes de guerre</td>
                  <td>1d12</td>
                  <td>oui</td>
                </tr>
              </table>
              <p>La catégorie <strong>Autres</strong> ne change rien : saisissez la formule à la main.</p>
            </div>
          </div>
          <p class="guide-astuce">
            La protection d'une armure est indicative : elle n'est pas déduite automatiquement des dégâts. Retirez-la à la main des dégâts subis par le donjexeur.
          </p>
        </div>
