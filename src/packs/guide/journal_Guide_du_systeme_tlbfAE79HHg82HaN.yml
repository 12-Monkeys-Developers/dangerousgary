  - _id: H6d2D2QVYtF1Kwbx
    name: Jets et messages
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="dg-guide">
          <h2>Les sauvegardes</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/carte-sauvegarde.webp" alt="Sauvegarde réussie" /></div>
            <div>
              <p>
                Un clic sur le nom d'une caractéristique lance <strong>1d20</strong> : la sauvegarde est réussie si le résultat est <strong>inférieur ou égal</strong> à la valeur
                actuelle de la caractéristique.
              </p>
              <ul>
                <li>Un <strong>1</strong> est toujours une réussite <strong>critique</strong> <i class="fas fa-check-double"></i>.</li>
                <li>Un <strong>20</strong> est toujours un <strong>fumble</strong> <i class="fas fa-skull-crossbones"></i>, quelle que soit la caractéristique.</li>
                <li>Sinon, la carte affiche une réussite <i class="fas fa-check"></i> ou un échec <i class="fas fa-times"></i>.</li>
              </ul>
              <p>
                La carte rappelle la caractéristique et la valeur visée, par exemple « Sauvegarde de DEX (12) » ; l'infobulle de ce texte précise s'il s'agit d'une sauvegarde de
                caractéristique ou de classe.
              </p>
            </div>
          </div>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/carte-sauvegarde-echec.webp" alt="Fumble sur une sauvegarde" /></div>
            <div>
              <h3>La sauvegarde de classe</h3>
              <p>
                Sur la fiche de Personnage, <kbd>Maj</kbd>+clic sur une caractéristique lance une <strong>sauvegarde de classe</strong> : le d20 est comparé au
                <strong>maximum</strong> de la caractéristique, et non à sa valeur actuelle. La carte du tchat l'indique : « Sauvegarde de classe FOR (12) » au lieu de
                « Sauvegarde de FOR (10) ».
              </p>
            </div>
          </div>

          <h3>Les talents</h3>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/carte-talent-echec.webp" alt="Échec d'un talent" /></div>
            <div>
              <p>
                Le dé d'un talent lance la sauvegarde de classe de sa classe. La carte affiche le nom du talent. En cas d'échec, le donjexeur perd autant de points de vie que le
                niveau du talent, le reste étant retiré de sa Force : la carte l'indique (par exemple « -2 PV, -1 FOR ») et la fiche est mise à jour.
              </p>
            </div>
          </div>

          <h2>Les dégâts</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/carte-degats-critique.webp" alt="Dégâts avec dommages critiques" /></div>
            <div>
              <p>
                Le dé <i class="fas fa-dice-d20"></i> d'une arme équipée ou d'une attaque lance sa formule de dégâts. Le survol du total affiche la formule lancée.
              </p>
              <p>
                Une arme avec <strong>Dommages critiques</strong> lance un dé qui <strong>explose une fois</strong> : si le dé fait son maximum, un second dé est ajouté. L'icône
                <i class="fas fa-burst"></i> n'apparaît sur la carte que si le dé a réellement explosé.
              </p>
            </div>
          </div>

          <h3>Attaques contraintes et exaltées</h3>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/fenetre-degats.webp" alt="Fenêtre des options de dégâts" /></div>
            <div>
              <p><kbd>Maj</kbd>+clic sur le dé de dégâts ouvre la fenêtre <strong>Options de dégâts</strong> :</p>
              <ul>
                <li><strong>Normale</strong> : la formule de l'arme ou de l'attaque ;</li>
                <li><strong>Contrainte (1d4)</strong> : 1d4, quelle que soit l'arme <i class="fas fa-link"></i> ;</li>
                <li><strong>Exaltée (dégâts max)</strong> : le maximum de chaque dé de la formule <i class="fas fa-crown"></i>.</li>
              </ul>
              <p>Une attaque contrainte ou exaltée n'explose jamais.</p>
            </div>
          </div>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/carte-degats-contrainte.webp" alt="Attaque contrainte" /></div>
            <div class="guide-image guide-image-card"><img src="systems/dangerousgary/assets/guide/carte-degats-exaltee.webp" alt="Attaque exaltée" /></div>
          </div>
          <h3>Cibler pour appliquer les dégâts</h3>
          <p>
            Sans cible, les dégâts sont seulement affichés : retirez-les à la main des points de vie, après déduction de l'armure. Si un ou plusieurs tokens sont
            <strong>ciblés</strong> au moment du jet, le système les applique à chaque cible :
          </p>
          <ul>
            <li>
              l'<strong>armure</strong> de la cible est déduite : celle de la fiche pour une Rencontre, la somme des armures <strong>équipées</strong> pour un Personnage ;
            </li>
            <li>
              les dégâts restants sont retirés des <strong>points de vie</strong>, et ce qui <strong>déborde</strong> est retiré de la <strong>Force</strong> ;
            </li>
            <li>
              quand la Force est entamée, la carte propose le bouton <strong>Sauvegarde de Force</strong> au joueur du personnage (ou au MJ). La carte du jet indique
              « Sauvegarde de FOR contre l'inconscience ». Ratée, le personnage subit un <strong>choc</strong> : l'état <strong>Inconscient</strong> est posé sur lui, et la
              carte d'origine affiche le résultat (« … subit un choc et est inconscient » ou « … résiste au choc et reste conscient »).
            </li>
            <li>
              une Force tombée à 0 est signalée, et l'état <strong>Mort</strong> est posé : le combattant est marqué vaincu dans le suivi de combat.
            </li>
          </ul>
          <p>
            La carte du tchat liste les cibles. Pour un <strong>Personnage</strong>, tout le monde voit l'armure, les dégâts subis, les points de vie et la Force perdus. Pour
            une <strong>Rencontre</strong>, les joueurs ne voient que les dégâts infligés : l'armure, les dégâts réels et l'état de la Rencontre sont réservés au MJ. Un clic
            sur le portrait d'une cible centre la vue sur son token.
          </p>
          <p class="guide-astuce">
            Les dégâts d'un joueur sur une Rencontre sont appliqués par le MJ connecté. Sans MJ en ligne, la carte indique « Dégâts non appliqués » et le MJ les applique
            plus tard avec le bouton <strong>Appliquer les dégâts</strong>.
          </p>

          <h2>Les états</h2>
          <p>
            Le système remplace la liste d'états de Foundry par la sienne. Un état se pose depuis le <strong>HUD du token</strong> (clic droit sur le token, icône des
            effets) ; son icône s'affiche sur le token et dans le suivi de combat. Certains états agissent sur les jets :
          </p>
          <table class="guide-table">
            <tr>
              <th>État</th>
              <th>Effet sur les jets</th>
            </tr>
            <tr>
              <td><strong>Contraint</strong>, <strong>Étourdi</strong>, <strong>Ralenti</strong>, <strong>Aveugle</strong></td>
              <td>Les jets de dégâts de l'acteur sont des attaques <strong>contraintes</strong> (1d4).</td>
            </tr>
            <tr>
              <td><strong>Exalté</strong></td>
              <td>Les jets de dégâts de l'acteur sont des attaques <strong>exaltées</strong> (dégâts max). Avec un état contraignant, les deux se compensent.</td>
            </tr>
            <tr>
              <td><strong>Malchance</strong></td>
              <td>Les sauvegardes lancent <strong>deux dés</strong> et gardent le pire. La carte l'indique par un chat noir <i class="fas fa-cat"></i>.</td>
            </tr>
            <tr>
              <td><strong>Mort</strong>, <strong>Paralysé</strong>, <strong>Inconscient</strong></td>
              <td>
                Posés automatiquement quand une caractéristique tombe à 0 : Force → Mort (combattant vaincu), Dextérité → Paralysé, Volonté → Inconscient. Ils sont retirés
                quand la caractéristique remonte au-dessus de 0. Inconscient est aussi posé quand une sauvegarde de Force contre le choc est ratée : celui-là reste à retirer
                à la main depuis le HUD du token, quand le personnage est secouru, comme les états posés par le MJ.
              </td>
            </tr>
            <tr>
              <td>À terre, Agrippé, En feu, Empoisonné, Invisible</td>
              <td>Simples marqueurs : aucun effet automatique.</td>
            </tr>
          </table>
          <p class="guide-astuce">
            <kbd>Maj</kbd>+clic sur le dé de dégâts ouvre toujours la fenêtre d'options : le type imposé par les états y est présélectionné, et vous pouvez en choisir un
            autre pour ce jet.
          </p>

          <h2>Les cartes du tchat</h2>
          <p>
            Chaque carte affiche le portrait et le nom du personnage ou de la Rencontre qui a lancé le jet. Les jets respectent le mode de diffusion choisi dans le tchat
            (public, MJ seulement, aveugle, pour soi).
          </p>
        </div>
